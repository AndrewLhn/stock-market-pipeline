stock_analytics_profile:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /opt/airflow/dbt_project/stock_market.duckdb
      extensions:
        - httpfs
        - aws
      settings:
        s3_endpoint: 'minio:9000'
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
        s3_use_ssl: false
        s3_url_style: 'path'