stock_analytics_profile:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /opt/airflow/dbt_project/stock_market.duckdb 
      extensions:
        - httpfs
        - aws
      settings:
        s3_endpoint: 'minio:9000'
        s3_access_key_id: 'minio_admin'
        s3_secret_access_key: 'minio_password_123'
        s3_use_ssl: false
        s3_url_style: 'path'